<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6330da" />
    <style>
      html { color-scheme: light; background: #faf9ff; }
      html[data-theme="dark"] { color-scheme: dark; background: #171326; }
    </style>
    <script>
      (() => {
        let theme = 'light';
        try { if (localStorage.getItem('senaverse-theme-v1') === 'dark') theme = 'dark'; } catch { /* Use the initial light theme. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#171326' : '#6330da');
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preload" href="/fonts/nunito-latin-variable.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="description" content="SeñaVerse: plataforma web educativa interactiva para aprender Lengua de Señas Peruana." />
    <title>SeñaVerse · Aprende Lengua de Señas Peruana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
